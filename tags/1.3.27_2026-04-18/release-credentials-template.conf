# GExperts release credentials
# Copy this file to ~/.config/gexperts/release.conf and fill in the values.
# Protect it: chmod 600 ~/.config/gexperts/release.conf
#
# Used by: __PublishRelease.sh

# SFTP server for uploading installer files and the HTML download page
SFTP_HOST="your-server.example.com"
SFTP_USER="username"
SFTP_PASS="password"

# Remote base path where installers are uploaded.
# Each release goes into a subdirectory: $SFTP_BASE_PATH/<version>_<date>/
SFTP_BASE_PATH="/path/to/downloads/gexperts"

# Remote path where the HTML download page is uploaded.
SFTP_HTML_PATH="/path/to/www/gexperts/releases"

# Public HTTPS URL corresponding to SFTP_BASE_PATH (for download links and verification)
HTTPS_BASE_URL="https://www.example.com/downloads/gexperts"

# Public HTTPS URL corresponding to SFTP_HTML_PATH (for the download page)
HTTPS_HTML_URL="https://www.example.com/gexperts/releases"

# SVN repository root (used for tagging)
SVN_REPO_ROOT="svn+ssh://twm@svn.code.sf.net/p/gexperts/code"
